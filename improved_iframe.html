<!DOCTYPE html>
<html>
<head>
    <title>noVNC Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        .test-container { 
            width: 100%; 
            height: 600px; 
            border: 2px solid #333; 
            background: #000;
            position: relative;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <h1>noVNC Auto-Connect Test</h1>
    <div class="test-container">
        <iframe 
            id="test-vnc"
            src="/novnc-view/vnc_auto.html?autoconnect=true&host=localhost&port=6080&password=nsKaZ1GLEPEzJa%2BSAhvw4D/VlweG4mcY&scale=0.6&pan_x=288&pan_y=180"
            frameborder="0">
        </iframe>
    </div>
    
    <script>
        const iframe = document.getElementById('test-vnc');
        
        // Log when iframe loads
        iframe.onload = function() {
            console.log('✓ Iframe loaded');
            console.log('✓ URL:', iframe.src);
            
            // Check if autoconnect param is present
            if (iframe.src.includes('autoconnect=true')) {
                console.log('✓ Auto-connect parameter found');
            } else {
                console.error('✗ Auto-connect parameter missing!');
            }
            
            // Check if password is present
            if (iframe.src.includes('password=')) {
                console.log('✓ Password parameter found');
            } else {
                console.error('✗ Password parameter missing!');
            }
            
            // Check if pan parameters are present
            if (iframe.src.includes('pan_x=')) {
                console.log('✓ Pan X parameter found');
            } else {
                console.error('✗ Pan X parameter missing!');
            }
            
            if (iframe.src.includes('pan_y=')) {
                console.log('✓ Pan Y parameter found');
            } else {
                console.error('✗ Pan Y parameter missing!');
            }
        };
        
        // Listen for errors
        iframe.onerror = function() {
            console.error('✗ Iframe failed to load');
        };
    </script>
</body>
</html>
